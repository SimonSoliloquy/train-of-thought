<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Train Track Builder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a1713'/%3E%3Cpath d='M4 2v12M12 2v12M3 4h10M3 8h10M3 12h10' stroke='%23ffd98a' stroke-width='1.6'/%3E%3C/svg%3E" />
    <meta name="description" content="Lay railway track across an endless low-poly landscape and watch the trains run. No score, no money, no end." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10141c; }
      #view { position: fixed; inset: 0; }
      .ttb-plate { position: fixed; left: 12px; top: 12px; max-width: min(430px, calc(100vw - 24px)); box-sizing: border-box;
        padding: 9px 14px 10px; border-radius: 6px; color: #f3e8cc; pointer-events: none;
        font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
        background: linear-gradient(180deg, #2b2620, #1a1713);
        box-shadow: 0 0 0 1px #0d0b09, 0 0 0 3px #b98d44, 0 0 0 4px #4a3210, 0 6px 18px rgba(0,0,0,.45); }
      .ttb-plate h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: .02em; color: #ffd98a; }
      .ttb-plate p { margin: 4px 0 0; font-size: 14px; line-height: 1.35; color: #f3e8cc; }
      .ttb-credit { position: fixed; left: 12px; bottom: 10px; font: 12px/1.3 Georgia, serif; color: #f3e8cc;
        background: rgba(26, 23, 19, .78); padding: 3px 8px; border-radius: 4px; }
      .ttb-credit a { color: #ffd98a; text-decoration: none; }
      .ttb-credit a:hover, .ttb-credit a:focus-visible { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div class="ttb-plate">
      <h1>Train Track Builder</h1>
      <p id="hint" aria-live="polite">Drawing the map&hellip;</p>
    </div>
    <div class="ttb-credit">
      Built by <a href="https://simonsoliloquy.com" target="_blank" rel="noopener">simonsoliloquy.com</a>
      &middot; <a href="https://wiki-train-of-thought.vercel.app" target="_blank" rel="noopener">Play the full game</a>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
